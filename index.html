<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MotorPool Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏍️ MotorPool Management</h1>
            <p>Kelola peminjaman motor dengan mudah</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="daftar">📋 Daftar Motor</button>
            <button class="tab-btn" data-tab="form">📝 Form Peminjaman</button>
            <button class="tab-btn" data-tab="log">📊 Log Aktivitas</button>
        </div>

        <!-- Filter -->
        <div class="filter-section" id="filterSection">
            <select id="filterKategori">
                <option value="all">Semua Kategori</option>
                <option value="MATIC">MATIC</option>
                <option value="SPORT">SPORT</option>
                <option value="BIGBIKE">BIGBIKE</option>
                <option value="BOX HMS">BOX HMS</option>
                <option value="EV">EV</option>
                <option value="SPORT OK">SPORT OK</option>
            </select>
            <select id="filterStatus">
                <option value="all">Semua Status</option>
                <option value="TERSEDIA">Tersedia</option>
                <option value="DIPINJAM">Dipinjam</option>
            </select>
            <input type="text" class="search-box" id="searchMotor" placeholder="🔍 Cari Nopol atau Tipe...">
        </div>

        <!-- Motor List -->
        <div id="motorList" class="motor-grid"></div>

        <!-- Form Section -->
        <div class="form-section" id="formSection">
            <h2>📝 Form Peminjaman Motor</h2>
            <form id="pinjamForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" placeholder="Masukkan nama" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="email@domain.com" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="dept">Departemen</label>
                        <input type="text" id="dept" placeholder="Departemen / Divisi" required>
                    </div>
                    <div class="form-group">
                        <label for="tujuan">Tujuan Peminjaman</label>
                        <input type="text" id="tujuan" placeholder="Tujuan peminjaman" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="tanggal">Tanggal Peminjaman</label>
                        <input type="date" id="tanggal" required>
                    </div>
                    <div class="form-group">
                        <label for="nopol">Nomor Polisi</label>
                        <select id="nopol" required>
                            <option value="">Pilih Motor</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="submitPinjam">Ajukan Peminjaman</button>
            </form>
        </div>

        <!-- Log Section -->
        <div class="log-section" id="logSection">
            <h3 style="margin-bottom:8px;font-size:16px;color:#1a237e;">📊 Log Aktivitas</h3>
            <div id="logEntries"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
